[package]
name = "blackshark-tray"
version = "0.1.7"
edition = "2021"
license = "GPL-3.0-or-later"

[[bin]]
name = "blackshark-tray"
path = "src/main.rs"

[dependencies]
blackshark-client = { path = "../blackshark-client" }
anyhow = "1"
ksni = { version = "0.3", default-features = false, features = ["async-io"] }
zbus = { version = "6", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread", "sync"] }
futures-util = "0.3"
